packages:
  - 'packages/*'
  - 'tools/*'

minimumReleaseAge: 1440

# @azure/identity 4.14.1 is the first release on @azure/msal-node ^7.1.0, which
# fixes GHSA-xcx6-jx8p-x3h5 (#566). Pinned to the exact version so the gate
# still applies to every other identity release.
minimumReleaseAgeExclude:
  - '@azure/identity@4.14.1'


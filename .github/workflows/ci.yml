name: CI

# Pull requests only. main and dev both require a PR, so a `push` trigger just ran
# the identical commit a second time -- PR #126 showed two "Build, Lint & Test"
# rows for one change. The merge result is covered because the release itself
# re-runs build, lint, and test in publish.yml before anything reaches npm.
on:
  pull_request:
    # dev is the default target for feature work and release/** branches are
    # integration targets for a whole line, so both need the same gate as main --
    # without this, PRs merge with no build, lint, format, or test run at all.
    branches: [main, dev, 'release/**']

permissions:
  contents: read

# Superseded pushes to a PR branch are pointless work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test with coverage
        run: pnpm run test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            packages/*/coverage/
          retention-days: 30


  e2e-python:
    name: E2E suite lint, format & types
    runs-on: ubuntu-latest
    # Separate job, not a step in `quality`: this needs uv and Python rather than the
    # Node toolchain, and it runs in parallel instead of lengthening that job. It gates
    # the Python that drives the shipped CLI, held to the same standard as the
    # TypeScript it drives (issue #160).
    #
    # No secrets and no tenant: this is static analysis only. The suite itself still
    # runs nightly from e2e.yml.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Lint
        working-directory: e2e
        run: uvx ruff check .

      - name: Format check
        working-directory: e2e
        run: uvx ruff format --check .

      - name: Typecheck
        working-directory: e2e
        run: uv run --frozen mypy .

  release-guard:
    name: Release version guard
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Branch name and package version must agree on an untagged version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          BRANCH_VERSION="${HEAD_REF##*/v}"
          if [ "$BRANCH_VERSION" != "$HEAD_REF" ] && [ "$BRANCH_VERSION" != "$VERSION" ]; then
            echo "::error::Branch $HEAD_REF disagrees with packages/sdk/package.json ($VERSION). Run: pnpm run release:version $BRANCH_VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already tagged, so merging this PR would publish nothing. Bump the version: pnpm run release:version patch"
            exit 1
          fi
          echo "v$VERSION is unreleased -- merging this PR will tag and publish it."

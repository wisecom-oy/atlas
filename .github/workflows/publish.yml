name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      version:
        description: 'Version to publish, without the leading v'
        required: true
        type: string
  # Repair path: republish an existing tag whose pipeline never ran or failed
  # after the tag was already pushed.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package versions
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG_VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          for pkg in sdk cli; do
            PKG_VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match packages/$pkg/package.json version ($PKG_VERSION)"
              exit 1
            fi
          done
          echo "Publishing version $TAG_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Publish SDK to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/sdk
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          else
            DIST_TAG="latest"
          fi
          echo "Publishing $VERSION to dist-tag: $DIST_TAG"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public --tag "$DIST_TAG"
          else
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi

      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/cli
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          else
            DIST_TAG="latest"
          fi
          echo "Publishing $VERSION to dist-tag: $DIST_TAG"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public --tag "$DIST_TAG"
          else
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TAG_VERSION }}
          prerelease: ${{ contains(env.TAG_VERSION, '-') }}
          generate_release_notes: true

name: Publish to npm

# Single entry point for every release path: a version bump reaching main, a
# manually pushed tag, or a manual dispatch to repair a stranded tag.
#
# Tagging and publishing MUST stay in this one file. npm trusted publishing
# validates the *entry point* workflow rather than the workflow containing
# `npm publish`, and there is no NPM_TOKEN -- authentication is OIDC. Splitting the
# tag step into its own workflow that called this one via workflow_call made the
# caller the entry point, so npm no longer matched the trusted publisher and the
# publish failed with ENEEDAUTH after the tag had already been pushed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  plan:
    name: Decide whether this is a release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release is defined by a version bump reaching main, not by the branch the
      # merge came from. History showed why: a docs-only merge (d27afb6) landed on
      # main right after v2.1.0-beta, and v1.2.3's tag sat on a commit with no bump
      # at all. Keying on the version makes ordinary merges free and lets a hotfix
      # use the same path as a release.
      - name: Resolve the version and tag it when new
        id: decide
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./packages/sdk/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = tag ] || [ -n "$INPUT_VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged -- this merge is not a release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Build & Publish
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG_VERSION: ${{ needs.plan.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.plan.outputs.version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package versions
        run: |
          for pkg in sdk cli; do
            PKG_VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag version ($TAG_VERSION) does not match packages/$pkg/package.json version ($PKG_VERSION)"
              exit 1
            fi
          done
          echo "Publishing version $TAG_VERSION"

      # v2.0.0-beta.0 shipped with no README at all, and because npmjs.com renders the
      # README of whichever version holds the `latest` dist-tag, the package page stayed
      # blank for months. Fail the release rather than publish a bare package again.
      - name: Stage the licence and require a readme in each package
        run: |
          for pkg in sdk cli; do
            if [ ! -s "packages/$pkg/README.md" ]; then
              echo "::error::packages/$pkg/README.md is missing or empty. npm renders it as the package page."
              exit 1
            fi
            cp LICENSE "packages/$pkg/LICENSE"
            echo "packages/$pkg: README.md $(wc -c < "packages/$pkg/README.md") bytes, LICENSE staged"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Publish SDK to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/sdk
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          else
            DIST_TAG="latest"
          fi
          echo "Publishing $VERSION to dist-tag: $DIST_TAG"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public --tag "$DIST_TAG"
          else
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi

      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/cli
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          else
            DIST_TAG="latest"
          fi
          echo "Publishing $VERSION to dist-tag: $DIST_TAG"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public --tag "$DIST_TAG"
          else
            npm publish --provenance --access public --tag "$DIST_TAG"
          fi

      # npmjs.com renders the README of whichever version holds `latest`, and `latest`
      # is still pinned to 2.0.0-beta.0, which shipped without a README. That is why both
      # package pages look empty even though every recent version ships one.
      #
      # A prerelease publishes to its own dist-tag and must never claim `latest` from a
      # stable release. But while `latest` is itself a prerelease there is no stable to
      # protect, so point it at what we just shipped. Once a real stable release exists
      # it publishes with `--tag latest` directly and this step stops firing, because
      # `latest` no longer contains a hyphen.
      - name: Move latest off a stale prerelease
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in sdk cli; do
            NAME=$(node -p "require('./packages/$pkg/package.json').name")
            CURRENT=$(npm view "$NAME" dist-tags.latest 2>/dev/null || echo "")
            if [ "$CURRENT" = "$TAG_VERSION" ]; then
              echo "$NAME: latest is already $TAG_VERSION"
            elif [ -z "$CURRENT" ] || [[ "$CURRENT" == *-* ]]; then
              npm dist-tag add "$NAME@$TAG_VERSION" latest
              echo "$NAME: latest moved from ${CURRENT:-none} to $TAG_VERSION"
            else
              echo "$NAME: latest is the stable $CURRENT, leaving it alone"
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TAG_VERSION }}
          prerelease: ${{ contains(env.TAG_VERSION, '-') }}
          generate_release_notes: true

  sync-dev:
    name: Keep dev in sync with main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The organisation forbids GitHub Actions from creating pull requests, so this
      # syncs dev by pushing main's commits straight onto it. A release or hotfix
      # merge leaves dev strictly behind main, which fast-forwards. If dev has
      # diverged the push is refused and the job fails loudly -- silently skipping
      # would let the next release branch revert a shipped hotfix.
      - name: Fast-forward dev onto main
        run: |
          AHEAD=$(git rev-list --count origin/dev..origin/main)
          if [ "$AHEAD" -eq 0 ]; then
            echo "dev already contains main."
            exit 0
          fi
          if git push origin "origin/main:refs/heads/dev"; then
            echo "Fast-forwarded dev by $AHEAD commit(s)."
            exit 0
          fi
          echo "::error::dev has diverged from main and cannot be fast-forwarded. Merge main into dev manually: https://github.com/${GITHUB_REPOSITORY}/compare/dev...main"
          exit 1

# Wisecom Trace: AI code review on request, posted as the Wisecom Trace GitHub App bot.
#
# Manual only. Nothing runs when a pull request is opened or pushed. To request a review:
# - comment `@wisecom-trace review` on the pull request, or
# - Actions -> Wisecom Trace review -> Run workflow, with the PR number.
# Only repository maintainers and admins can request one by comment: Trace checks the
# commenter's role, reacts with eyes when it accepts the request, and ignores anyone else.
#
# GitHub runs issue_comment workflows from the default branch (main) and offers Run
# workflow only for workflows on it, so neither trigger works until this file is on main.
#
# This repository is public, so Trace runs in public mode (TRACE_PUBLIC): the PR comments
# and this log show no model, cost, coverage, timings or reviewer internals. Trace's own
# settings live in one secret, never in this file or in plain env values, which the log
# prints.
#
# Settings -> Secrets and variables -> Actions:
#   vars.TRACE_GITHUB_APP_ID      GitHub App id
#   secrets.TRACE_GITHUB_APP_KEY  GitHub App private key, PEM
#   secrets.TRACE_SETTINGS        Trace's settings file (JSON), including its API key
name: Wisecom Trace review

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        type: number
        required: true

# The workflow token only reads; reactions and reviews use the App's own token.
permissions:
  contents: read

jobs:
  review:
    # A cheap filter so other comments do not build Trace. The real gate is Trace's own
    # role check (maintain or admin), which also covers comments on fork PRs, whose runs
    # get this repository's secrets. No author_association filter: on a public repository
    # it reports a member with private org membership as a contributor.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && github.event.sender.type != 'Bot' &&
        contains(github.event.comment.body, '@wisecom-trace review'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A new request for the same PR supersedes the one in progress.
    concurrency:
      group: trace-review-${{ github.event.issue.number || inputs.pr }}
      cancel-in-progress: true
    steps:
      # Read-only token for the private Trace source, minted from the App.
      - id: source
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TRACE_GITHUB_APP_ID }}
          private-key: ${{ secrets.TRACE_GITHUB_APP_KEY }}
          owner: wisecom-oy
          repositories: trace
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: wisecom-oy/trace
          token: ${{ steps.source.outputs.token }}
          path: trace
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: trace/go.mod
          cache-dependency-path: trace/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ./build.sh
        working-directory: trace
      # The settings file is written outside the workspace, readable only by this user.
      - name: Write Trace settings
        env:
          TRACE_SETTINGS: ${{ secrets.TRACE_SETTINGS }}
        run: |
          if [ -z "$TRACE_SETTINGS" ]; then
            echo "::error::The TRACE_SETTINGS secret is not set."
            exit 1
          fi
          umask 077
          printf '%s' "$TRACE_SETTINGS" > "${RUNNER_TEMP}/trace-settings.json"
      # With --comment-id, Trace checks the commenter's role and reacts with eyes before it
      # reviews. It reads the PR's code; it never installs dependencies or runs it.
      - name: Review and publish
        run: |
          comment_args=()
          if [ -n "$COMMENT_ID" ]; then comment_args=(--comment-id "$COMMENT_ID"); fi
          trace/bin/trace pr --target "github:${GITHUB_REPOSITORY}#${PR_NUMBER}" "${comment_args[@]}"
        env:
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr }}
          COMMENT_ID: ${{ github.event.comment.id }}
          TRACE_CONFIG: ${{ runner.temp }}/trace-settings.json
          TRACE_PUBLIC: 'true'
          TRACE_GITHUB_APP_ID: ${{ vars.TRACE_GITHUB_APP_ID }}
          TRACE_GITHUB_APP_KEY: ${{ secrets.TRACE_GITHUB_APP_KEY }}

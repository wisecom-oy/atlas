name: Tag release

# A release is defined by a version bump reaching main, not by which branch the
# merge came from. History showed why: a docs-only merge (d27afb6) landed on main
# right after v2.1.0-beta, and v1.2.3's tag sat on a commit with no bump at all.
# Keying on the version makes non-release merges free and hotfixes work without a
# second code path.
on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  tag:
    name: Tag if the version is new
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      created: ${{ steps.check.outputs.created }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the tag when the version has no tag yet
        id: check
        run: |
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged -- this merge is not a release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: tag
    if: needs.tag.outputs.created == 'true'
    # A tag pushed with GITHUB_TOKEN does not trigger workflows, so publish.yml is
    # called directly instead of relying on its own push:tags trigger.
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit

  back-merge:
    name: Keep dev in sync with main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The organisation forbids GitHub Actions from creating pull requests, so
      # this syncs dev by pushing main's commits straight onto it. A release or
      # hotfix merge leaves dev strictly behind main, which fast-forwards. If dev
      # has diverged the push is refused and the job fails loudly -- silently
      # skipping would let the next release branch revert a shipped hotfix.
      - name: Fast-forward dev onto main
        run: |
          AHEAD=$(git rev-list --count origin/dev..origin/main)
          if [ "$AHEAD" -eq 0 ]; then
            echo "dev already contains main."
            exit 0
          fi
          if git push origin "origin/main:refs/heads/dev"; then
            echo "Fast-forwarded dev by $AHEAD commit(s)."
            exit 0
          fi
          echo "::error::dev has diverged from main and cannot be fast-forwarded. Merge main into dev manually: https://github.com/${GITHUB_REPOSITORY}/compare/dev...main"
          exit 1

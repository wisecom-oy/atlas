# MinIO for the E2E run. Thrown away with the runner, so the credentials are not secrets.
#
# Four drives, not one: Object Lock requires bucket versioning, and MinIO's support
# for versioning on a single-drive backend depends on the release. `server /data{1...4}` is the
# configuration that works on every version, so an image bump cannot silently disable the
# immutability suite. `test_00_preflight` asserts `storage-check` still reports `lock-capable`.
#
# Built from MinIO's source by `docker/minio/Dockerfile`, the same image `docker/docker-compose.yml`
# gives operators, so the immutability suite runs against what self-hosters run. No prebuilt
# community image pulls anonymously any more: Docker Hub removed `minio/minio` (2026-09-12) and
# quay.io refuses it (2026-09-24), which killed the nightly at this step (issues #406, #429, #800).
# The Dockerfile pins MinIO by commit, so the backend changes only with a reviewable diff, and
# `test_00_preflight` proves a bumped commit is still `lock-capable`.
services:
  minio-primary:
    build: ../docker/minio
    image: atlas-minio:7aac2a2c5b7c
    container_name: atlas-e2e-minio-primary
    # `/data/{1...4}`: the four drives must exist, so they live under one mounted volume.
    command: server /data/{1...4} --console-address ":9001"
    ports:
      - '${E2E_S3_PORT:-9000}:9000'
      - '${E2E_S3_CONSOLE_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: ${E2E_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${E2E_S3_SECRET_KEY:-minioadmin}
    volumes:
      - e2e_primary:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  e2e_primary:
